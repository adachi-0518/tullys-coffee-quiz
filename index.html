<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コーヒー豆診断 | TULLY'S COFFEE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== スタート画面 ===== -->
    <section id="screen-start" class="screen active">
      <p class="kicker">TULLY&rsquo;S BEAN DIAL</p>

      <div class="dial">
        <!-- 17個の丸が円状に並んでゆっくり回転（丸は script.js で生成） -->
        <svg id="dial-ring" class="dial-ring" viewBox="0 0 196 196" width="196" height="196" aria-hidden="true"></svg>
        <div class="dial-center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00533e" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 2v2M14 2v2M6 2v2"></path>
            <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path>
          </svg>
          <p>全17種から</p>
        </div>
      </div>

      <h1 class="title">コーヒー豆診断</h1>
      <p class="lead">5つの質問に答えると、いまの気分に合う一杯が見つかります。</p>

      <button class="btn-cta" onclick="startQuiz()">
        診断をはじめる
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </button>
      <p class="cta-note">およそ30秒</p>

      <p class="disclaimer">店舗スタッフが制作したオリジナルアプリです（タリーズコーヒー公式のアプリではありません）。豆の情報は公式サイト調べ・2026年7月時点。</p>
    </section>

    <!-- ===== 質問画面 ===== -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-head">
        <div class="cup-progress" aria-hidden="true">
          <div class="cup-body"><div id="cup-fill" class="cup-fill"></div></div>
          <div class="cup-handle"></div>
        </div>
        <div class="q-count">
          <span id="q-num" class="q-num">01</span>
          <span class="q-total">/ 05</span>
        </div>
        <p id="q-hint" class="q-hint">直感でどうぞ</p>
      </div>

      <!-- 前の設問をフェードアウトしてから中身だけ差し替える枠 -->
      <div id="q-body" class="q-body">
        <h2 id="question-text" class="question"></h2>
        <div class="choices">
          <button class="choice choice-a" onclick="answer(0)">
            <span class="badge badge-a">A</span>
            <span id="choice-a" class="choice-label"></span>
          </button>
          <button class="choice choice-b" onclick="answer(1)">
            <span class="badge badge-b">B</span>
            <span id="choice-b" class="choice-label"></span>
          </button>
        </div>
      </div>

      <button id="back-btn" class="back-btn" onclick="goBack()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
        ひとつ前にもどる
      </button>
    </section>

    <!-- ===== 結果画面 ===== -->
    <section id="screen-result" class="screen">
      <p class="result-label">あなたにおすすめの豆は…</p>

      <div class="result-card">
        <div class="result-header">
          <div class="header-blob"></div>
          <div class="header-inner">
            <div class="result-tags">
              <span id="result-category" class="tag tag-accent"></span>
              <span id="result-flavor" class="tag tag-outline"></span>
            </div>
            <h2 id="result-name" class="result-name"></h2>
            <p id="result-tagline" class="result-tagline"></p>
          </div>
        </div>

        <div class="result-body">
          <p id="result-origin" class="result-origin"></p>
          <p id="result-desc" class="result-desc"></p>

          <div class="taste-row">
            <span class="taste-label">すっきり感</span>
            <span id="pips-kire" class="pips"></span>
            <span id="value-kire" class="taste-value"></span>
          </div>
          <div class="taste-row">
            <span class="taste-label">ボディ</span>
            <span id="pips-body" class="pips"></span>
            <span id="value-body" class="taste-value"></span>
          </div>
          <p class="taste-note">タリーズ公式サイトの10段階評価</p>

          <div class="pairing">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56633f" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 2v2M14 2v2M6 2v2"></path>
              <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"></path>
            </svg>
            <p id="result-pairing"></p>
          </div>
          <p id="result-price" class="result-price"></p>

          <a id="result-link" class="result-link" href="#" target="_blank" rel="noopener">
            公式サイトでこの豆を見る
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </a>
        </div>
      </div>

      <div class="runner-up">
        <span class="runner-badge">2</span>
        <div>
          <p class="runner-label">こちらもおすすめ</p>
          <p id="runner-up-name" class="runner-name"></p>
        </div>
      </div>

      <button class="btn-secondary" onclick="restart()">もう一度診断する</button>
      <p class="disclaimer">価格・取扱いは変更になる場合があります。詳しくは店舗スタッフまでお気軽にどうぞ。</p>
    </section>

  </div>
  <script src="script.js"></script>
</body>
</html>
